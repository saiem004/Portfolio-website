name: wf-ci-develop
on:
  pull_request:
    branches: [develop]

jobs:
  lint-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository on runner
        uses: actions/checkout@v4
        
      - name: Lint HTML files
        run: npx htmlhint "**/*.html"
        
      - name: Lint CSS files
        run: npx stylelint "**/*.css"